<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 40px; margin: 0; }
  .container { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; }
  .title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
  .msg { margin-bottom: 24px; }
  .label { font-size: 11px; color: #666; margin-bottom: 4px; padding-left: 4px; }
  .bubble { background: #f2f3f5; padding: 12px 16px; border-radius: 12px; border-bottom-left-radius: 4px; font-size: 14px; line-height: 1.6; color: #333; display: inline-block; max-width: 85%; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn { width: 28px; height: 28px; border-radius: 6px; background: #f2f3f5; color: #999; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .logo { display: inline-flex; margin-top: 12px; width: 16px; height: 16px; background: #d97757; border-radius: 50%; }
</style>
</head>
<body>
<div class="container">
  <div class="title">模型 Logo 在气泡外、底部</div>
  <div class="msg">
    <div class="label">Claude</div>
    <div class="bubble">你好！有什么可以帮你的吗？</div>
    <div class="actions">
      <div class="btn">📋</div>
      <div class="btn">↩</div>
      <div class="btn">▶</div>
      <div class="btn">👍</div>
      <div class="btn">👎</div>
      <div class="btn">🔄</div>
    </div>
    <div class="logo"></div>
  </div>
</div>
</body>
</html>
